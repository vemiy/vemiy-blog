name: 友链校验

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "source/_data/link.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验格式并验证回链
        id: check
        run: |
          pip install pyyaml -q
          python3 - <<'EOF'
          import yaml, urllib.request, sys
          data = yaml.safe_load(open('source/_data/link.yml'))
          groups = data if isinstance(data, list) else [data]
          items = [it for g in groups for it in (g.get('link_list') or [])]
          try:
              if not items:
                  raise SystemExit('没有新增友链')
              for it in items:
                  for f in ('name', 'link', 'avatar', 'descr'):
                      if not str(it.get(f) or '').strip():
                          raise SystemExit(f'缺少字段 {f}')
                  if not str(it['link']).startswith('http'):
                      raise SystemExit(f'链接格式错误: {it["link"]}')
                  req = urllib.request.Request(it['link'], headers={'User-Agent': 'Mozilla/5.0 (compatible; FriendLinkBot/1.0)'})
                  try:
                      html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', 'ignore').lower()
                  except Exception as e:
                      raise SystemExit(f'无法访问 {it["link"]}: {e}')
                  if 'vemiy.com' not in html:
                      raise SystemExit(f'{it["link"]} 页面上没有找到指向 vemiy.com 的回链')
              print(f'校验通过：{len(items)} 条友链格式正确，回链验证成功')
          except SystemExit as e:
              with open('result.txt', 'w') as f:
                  f.write(str(e))
              raise
          except Exception as e:
              with open('result.txt', 'w') as f:
                  f.write(str(e))
              raise
          EOF

      - name: 评论校验结果
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f result.txt ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "❌ 友链校验未通过：$(cat result.txt)"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "✅ 友链格式正确，回链验证通过。站长合并后即可上架。"
          fi
