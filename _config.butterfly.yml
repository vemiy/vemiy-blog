# --------------------------------------
# Hexo Butterfly 主题配置
# 如有问题请参考文档
# 中文: https://butterfly.js.org/
# 英文: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# 导航设置
# --------------------------------------

nav:
  logo:                       # 导航栏 Logo 图片
  display_title: true         # 是否显示站点标题
  display_post_title: true    # 滚动时是否显示文章标题
  fixed: true                 # 是否固定导航栏

menu:
  # 导航菜单（格式: 名称: 链接 || 图标）
  首页: / || fas fa-home
  博客||fas fa-blog:
    归档: /archives/ || fas fa-archive
    分类: /categories/ || fas fa-folder-open
    标签: /tags/ || fas fa-tags
  工具: /tools/ || fas fa-wrench
  友链: /links/ || fas fa-link
  关于: /about/ || fas fa-user

# --------------------------------------
# 代码块设置
# --------------------------------------

code_blocks:
  theme: light                # 代码块主题（darker / pale night / light / ocean / false）
  macStyle: false             # 是否使用 macOS 风格窗口
  height_limit: false         # 代码块高度限制（px）
  word_wrap: false            # 是否自动换行
  copy: true                  # 是否显示复制按钮
  language: true              # 是否显示语言标签
  shrink: false               # 代码块收缩方式（true 收缩 / false 展开 / none 展开并隐藏按钮）
  fullpage: false             # 是否显示全屏按钮

# 社交链接
# 格式: 图标: 链接 || 描述 || 颜色
social:
  fab fa-github: https://github.com/vemiy || GitHub
  fab fa-bilibili: https://space.bilibili.com/520992461 || Bilibili
  fas fa-envelope: mailto:hi@vemiy.com || Email
  fas fa-rss: /atom.xml || RSS

# --------------------------------------
# 图片设置
# --------------------------------------

favicon: /img/favicon.png     # 网站 favicon 图标

avatar:
  img: /img/avatar.webp       # 头像图片
  effect: false               # 是否启用头像旋转效果

disable_top_img: false        # 是否禁用所有横幅图片

default_top_img: transparent  # 页面未设置横幅时显示的默认横幅

index_img: transparent        # 首页横幅图片

archive_img:                  # 归档页横幅图片

tag_img:                      # 标签页横幅图片（单标签页，不是标签列表页）

tag_per_img:                  # 每个标签单独设置的横幅
  # 格式:
  #  - 标签名: 图片地址

category_img:                 # 分类页横幅图片（单分类页，不是分类列表页）

category_per_img:             # 每个分类单独设置的横幅
  # 格式:
  #  - 分类名: 图片地址

footer_img: transparent       # 页脚背景图片

background:                   # 网站背景（颜色/图片地址/数组随机选择）

cover:
  index_enable: true          # 首页是否显示封面
  aside_enable: true          # 侧边栏是否显示封面
  archives_enable: true       # 归档页是否显示封面
  default_cover:              # 未设置封面时显示的默认封面
    # - xxx.jpg

# 图片加载失败的替代图
error_img:
  flink: /img/friend_404.gif  # 友链页错误图片
  post_page: /img/404.jpg     # 文章页错误图片

# 简单 404 页面
error_404:
  enable: true                # 是否启用 404 页面
  subtitle: 'Page Not Found'  # 404 页面副标题
  background: /img/error-page.png   # 404 页面背景图片

post_meta:
  page:                       # 首页文章元数据
    date_type: created        # 日期类型（created 创建 / updated 更新 / both 两者）
    date_format: date         # 日期格式（date / relative）
    categories: true          # 是否显示分类
    tags: false               # 是否显示标签
    label: true               # 是否显示文字标签
  post:                       # 文章页元数据
    position: left            # 元数据位置（left / center）
    date_type: both           # 日期类型（created / updated / both）
    date_format: date         # 日期格式（date / relative）
    categories: true          # 是否显示分类
    tags: true                # 是否显示标签
    label: true               # 是否显示文字标签

# --------------------------------------
# 首页设置
# --------------------------------------

# 首页头图设置
# 默认: 头图全屏，站点信息居中
index_site_info_top:          # 首页站点信息位置（如 300px / 10%）
index_top_img_height: 400px   # 首页头图高度

# 首页副标题
subtitle:
  enable: true                # 是否启用副标题
  effect: true                # 是否启用打字机效果
  typed_option:               # typed.js 自定义配置
    typeSpeed: 150    # 打字速度，越小越快（默认 150）
    backSpeed: 50     # 删除速度，越小越慢（默认 50）
  source: false               # 副标题来源（false 关闭 / 1 一言 / 2 一言替代 / 3 今日诗词）
  sub:                        # 副标题内容
    - One more day.

# 首页文章布局
index_layout: 3               # 布局样式（1 左图右文 / 2 右图左文 / 3 交替 / 4 上图下文 / 5 图上显示信息 / 6-7 瀑布流）

# 首页文章简介
index_post_content:
  method: 3                   # 简介方式（1 描述 / 2 描述或摘要 / 3 自动摘要 / false 不显示）
  length: 500                 # 摘要长度（method 为 2 或 3 时生效）

# --------------------------------------
# 文章设置
# --------------------------------------

toc:
  post: true                  # 文章页是否显示目录
  page: false                 # 页面是否显示目录
  number: true                # 目录是否显示编号
  expand: false               # 目录是否默认展开
  style_simple: false         # 是否使用简洁目录样式（仅文章页）
  scroll_percent: true        # 是否显示阅读进度百分比

post_copyright:
  enable: true                # 是否显示文章版权声明
  decode: false               # 是否解码文章 URL
  author_href:                # 作者链接
  license: CC BY-NC-SA 4.0    # 版权许可类型
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/   # 许可协议链接

# 打赏/赞助
reward:
  enable: false               # 是否启用打赏
  text:                       # 打赏提示文字
  QR_code:                    # 收款二维码
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# 文章在线编辑
post_edit:
  enable: false               # 是否启用在线编辑
  url:                        # 编辑链接模板

# 相关文章
related_post:
  enable: true                # 是否显示相关文章
  limit: 6                    # 相关文章数量
  date_type: created          # 排序依据（created / updated）

post_pagination: 1            # 上一篇/下一篇（1 下一篇指向旧文章 / 2 指向新文章 / false 禁用）

# 文章过期提示
noticeOutdate:
  enable: true               # 是否启用过期提示
  style: flat                 # 提示样式（simple / flat）
  limit_day: 365              # 多少天后提示过期
  position: top               # 提示位置（top / bottom）
  message_prev: It has been   # 提示前半句
  message_next: days since the last update, the content of the article may be outdated.   # 提示后半句

# --------------------------------------
# 页脚设置
# --------------------------------------

footer:
  nav:                        # 页脚导航栏
  owner:
    enable: false             # 是否显示站点所有者
    since: 2026               # 建站年份
  copyright:
    enable: false             # 是否显示主题和框架版权
    version: true             # 是否显示版本号
  custom_text: '<div id="site-runtime">已运行<span class="stand" id="rt-d">0</span>天<span class="stand" id="rt-h">00</span>时<span class="stand" id="rt-m">00</span>分<span class="stand" id="rt-s">00</span>秒<span class="footer-stats"> · 访客数 <span id="vercount_value_site_uv">0</span> · 访问量 <span id="vercount_value_site_pv">0</span></span></div><div class="footer-copyright-line">&copy;&nbsp;2026 By vemiy · <a href="https://icp.gov.moe/?keyword=20269230" target="_blank">萌ICP备20269230号</a></div>'   # 页脚自定义内容（建站时长、访客统计、版权、萌ICP备案）

# --------------------------------------
# 侧边栏设置
# --------------------------------------

aside:
  enable: true                # 是否启用侧边栏
  hide: false                 # 是否默认隐藏侧边栏
  button: true                # 右下角是否显示隐藏侧边栏按钮
  mobile: true                # 移动端是否显示侧边栏
  position: right             # 侧边栏位置（left / right）
  display:
    archive: true             # 归档页是否显示侧边栏
    tag: true                 # 标签页是否显示侧边栏
    category: true            # 分类页是否显示侧边栏
  card_author:
    enable: true              # 是否显示作者信息卡片
    description:              # 作者描述
    button:
      enable: false           # 是否显示作者卡片按钮
  card_announcement:
    enable: true              # 是否显示公告卡片
    content: This is my Blog  # 公告内容
  card_recent_post:
    enable: true              # 是否显示最新文章卡片
    limit: 5                  # 显示文章数（0 显示全部）
    sort: date                # 排序依据（date / updated）
    sort_order:               # 排序方向
  card_newest_comments:
    enable: false             # 是否显示最新评论卡片
    sort_order:               # 排序方向
    limit: 6                  # 显示评论数
    storage: 10               # 缓存时间（分钟，存 localStorage）
    avatar: true              # 是否显示头像
  card_categories:
    enable: true              # 是否显示分类卡片
    limit: 8                  # 显示分类数（0 显示全部）
    expand: none              # 展开方式（none / true / false）
    sort_order:               # 排序方向
  card_tags:
    enable: true              # 是否显示标签卡片
    limit: 40                 # 显示标签数（0 显示全部）
    color: false              # 标签是否显示颜色
    custom_colors:            # 自定义标签颜色
    orderby: random           # 标签排序方式（random / name / length）
    order: 1                  # 排序方向（1 升序 / -1 降序）
    sort_order:               # 排序方向
  card_archives:
    enable: true              # 是否显示归档卡片
    type: monthly             # 归档类型（monthly 按月 / yearly 按年）
    format: MMMM YYYY         # 日期格式
    order: -1                 # 排序方向（1 升序 / -1 降序）
    limit: 8                  # 显示归档数（0 显示全部）
    sort_order:               # 排序方向
  card_post_series:
    enable: true              # 是否显示文章系列卡片
    series_title: false       # 标题是否显示系列名
    orderBy: 'date'           # 排序依据（title / date）
    order: -1                 # 排序方向（1 升序 / -1 降序）
  card_webinfo:
    enable: true              # 是否显示网站信息卡片
    post_count: true          # 是否显示文章数
    last_push_date: true      # 是否显示最后推送日期
    sort_order:               # 排序方向
    runtime_date: 2026-03-16  # 建站日期（用于显示运行时间）

# --------------------------------------
# 右下角按钮设置
# --------------------------------------

rightside_bottom:             # 右下角按钮距底部距离（px）

# 简繁转换
translate:
  enable: true               # 是否启用简繁转换
  default: 繁                 # 按钮文字
  defaultEncoding: 2          # 站点语言（1 繁体 / 2 简体）
  translateDelay: 0           # 转换延迟
  msgToTraditionalChinese: '繁'    # 简体时的按钮文字
  msgToSimplifiedChinese: '簡'     # 繁体时的按钮文字

# 阅读模式
readmode: true                # 是否启用阅读模式

# 暗黑模式
darkmode:
  enable: false               # 是否启用暗黑模式
  button: false               # 是否显示切换按钮
  autoChangeMode: false       # 自动切换模式（false 关闭 / 1 跟随系统 / 2 固定时间段）
  start:                      # 亮色模式开始时间
  end:                        # 亮色模式结束时间

rightside_scroll_percent: false   # 返回顶部按钮是否显示滚动百分比

# 以下设置不要修改，除非你知道它们的用途
# 可选值: readmode,translate,darkmode,hideAside,toc,chat,comment（不要重复）
rightside_item_order:
  enable: true                # 是否启用右下角按钮顺序
  hide: readmode,translate,hideAside   # 隐藏的按钮（默认: readmode,translate,darkmode,hideAside）
  show: toc,chat,comment      # 显示的按钮（默认: toc,chat,comment）

rightside_config_animation: true   # 右下角配置按钮是否有动画

# --------------------------------------
# 全局设置
# --------------------------------------

anchor:
  auto_update: false          # 滚动时 URL 是否随标题更新
  click_to_scroll: false      # 点击标题是否滚动并更新锚点

photofigcaption: false        # 图片是否显示标题

copy:
  enable: true                # 是否允许复制
  copyright:
    enable: false             # 复制后是否追加版权信息
    limit_count: 150          # 超过该字数才追加版权

# 需要安装 hexo-wordcount 插件
wordcount:
  enable: true                # 是否启用字数统计
  post_wordcount: true        # 文章页是否显示字数
  min2read: true              # 文章页是否显示阅读时长
  total_wordcount: true       # 侧边栏是否显示全站总字数

# 不蒜子统计（已改用 Vercount，此处关闭）
busuanzi:
  site_uv: false              # 站点访客数
  site_pv: false              # 站点访问量
  page_pv: true               # 页面访问量

# --------------------------------------
# 数学公式
# --------------------------------------

# per_page: true 每页都加载公式脚本；false 按页面 front-matter 决定
math:
  use:                        # 公式引擎（mathjax / katex，空为不启用）
  per_page: true              # 是否每页加载公式脚本
  hide_scrollbar: false       # 是否隐藏滚动条
  mathjax:
    enableMenu: true          # 是否启用右键菜单
    tags: none                # 公式编号方式（all / ams / none）
  katex:
    copy_tex: false           # 是否支持复制 KaTeX 公式

# --------------------------------------
# 搜索
# --------------------------------------

search:
  use: local_search           # 搜索系统（algolia_search / local_search / docsearch，空为不启用）
  placeholder:                # 搜索框占位文字
  algolia_search:
    hitsPerPage: 6            # 每页搜索结果数
  local_search:
    preload: false            # 页面加载时是否预载搜索数据
    top_n_per_article: 1      # 每篇文章显示的结果数（-1 显示全部）
    unescape: false           # 是否反转义 HTML 字符串
    pagination:
      enable: false           # 搜索结果是否分页
      hitsPerPage: 8          # 每页搜索结果数
    CDN:                      # 自定义 CDN
  docsearch:
    appId:                    # Docsearch 应用 ID
    apiKey:                   # Docsearch API 密钥
    indexName:                # Docsearch 索引名
    option:                   # Docsearch 配置

# --------------------------------------
# 分享系统
# --------------------------------------

share:
  use: sharejs                # 分享系统（sharejs / addtoany，空为不启用）
  sharejs:
    sites: facebook,x,wechat,weibo,qq   # 分享平台
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link   # 分享平台

# --------------------------------------
# 评论系统
# --------------------------------------

comments:
  use: Twikoo                 # 评论系统（最多两个，第一个为默认；可选 Disqus/Valine/Waline/Twikoo 等）
  text: true                  # 按钮旁是否显示评论系统名称
  lazyload: false             # 是否滚动到评论区才加载（开启后评论计数失效）
  count: true                 # 文章页是否显示评论数
  card_post_count: false      # 首页是否显示评论数

# Disqus
disqus:
  shortname:                  # Disqus 站点名
  apikey:                     # 最新评论部件 API 密钥

# DisqusJS（Disqus 替代方案）
disqusjs:
  shortname:                  # Disqus 站点名
  apikey:                     # API 密钥
  option:                     # 配置

# Livere
livere:
  uid:                        # Livere 站点 ID

# Gitalk
gitalk:
  client_id:                  # GitHub OAuth 客户端 ID
  client_secret:              # GitHub OAuth 客户端密钥
  repo:                       # 存放评论的仓库
  owner:                      # 仓库所有者
  admin:                      # 管理员账号
  option:                     # 配置

# Valine
valine:
  appId:                      # LeanCloud 应用 ID
  appKey:                     # LeanCloud 应用密钥
  avatar: monsterid           # 默认头像样式
  serverURLs:                 # 自定义服务器地址（国内域名用户填写）
  bg:                         # 背景图片
  visitor: false              # 是否用 Valine 访问量作页面浏览量
  option:                     # 配置

# Waline
waline:
  serverURL:                  # Waline 服务地址
  bg:                         # 背景图片
  pageview: false             # 是否用 Waline 访问量作页面浏览量
  option:                     # 配置

# Utterances
utterances:
  repo:                       # GitHub 仓库
  issue_term: pathname        # Issue 映射方式（pathname/url/title/og:title）
  light_theme: github-light   # 亮色主题
  dark_theme: photon-dark     # 暗色主题
  js:                         # 自定义脚本地址
  option:                     # 配置

# Facebook 评论
facebook_comments:
  app_id:                     # Facebook 应用 ID
  user_id:                    # 可选用户 ID
  pageSize: 10                # 每页评论数
  order_by: social            # 排序方式（social / time / reverse_time）
  lang: en_US                 # 语言

# Twikoo
twikoo:
  envId: https://twikoo.vemiy.com/   # Twikoo 环境 ID 或服务地址
  region:                     # 环境地域
  visitor: false              # 是否用 Twikoo 访问量作页面浏览量
  option:                     # 配置

# Giscus
giscus:
  repo:                       # GitHub 仓库
  repo_id:                    # 仓库 ID
  category_id:                # 分类 ID
  light_theme: light          # 亮色主题
  dark_theme: dark            # 暗色主题
  js:                         # 自定义脚本地址
  option:                     # 配置

# Remark42
remark42:
  host:                       # Remark42 服务地址
  siteId:                     # 站点 ID
  option:                     # 配置

# Artalk
artalk:
  server:                     # Artalk 服务地址
  site:                       # 站点名
  visitor: false              # 是否用 Artalk 访问量作页面浏览量
  option:                     # 配置

# --------------------------------------
# 聊天服务
# --------------------------------------

chat:
  use:                        # 聊天服务（chatra/tidio/crisp/knocket，空为不启用）
  rightside_button: false     # 是否在右下角创建聊天按钮
  button_hide_show: false     # 聊天按钮是否随滚动显示/隐藏

chatra:
  id:                         # Chatra 站点 ID

tidio:
  public_key:                 # Tidio 公钥

crisp:
  website_id:                 # Crisp 站点 ID

knocket:
  identifier:                 # Knocket 标识

# --------------------------------------
# 统计与分析
# --------------------------------------

baidu_analytics:              # 百度统计 ID

google_analytics:             # Google Analytics ID

cloudflare_analytics:         # Cloudflare Analytics 站点 ID

microsoft_clarity:            # Microsoft Clarity 项目 ID

umami_analytics:
  enable: false               # 是否启用 Umami
  serverURL:                  # 自建 Umami 服务地址
  script_name: script.js      # 脚本名
  website_id:                 # 网站 ID
  option:                     # 配置
  UV_PV:
    site_uv: false            # 站点访客数
    site_pv: false            # 站点访问量
    page_pv: false            # 页面访问量
    token:                    # Umami API 令牌

google_tag_manager:
  tag_id:                     # GTM 容器 ID
  domain:                     # 可选自定义域名

# --------------------------------------
# 广告
# --------------------------------------

# Google AdSense（未启用，广告代码已通过 inject 和 ad 配置加入）
google_adsense:
  enable: false               # 是否启用 AdSense
  auto_ads: true              # 是否启用自动广告
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js   # 广告脚本地址
  client:                     # 广告客户端 ID
  enable_page_level_ads: true # 是否启用网页级广告

# 手动插入广告（不需要留空）
ad:
  index:                      # 首页广告（每三篇文章插入一条）
  aside:                      # 侧边栏广告
  post: '<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2932938307892796" data-ad-slot="1005927038" data-ad-format="auto" data-full-width-responsive="true"></ins><script data-pjax>(adsbygoogle = window.adsbygoogle || []).push({});</script>'   # 文章底部广告（分页前，data-pjax 让 PJAX 跳转后也加载）

# --------------------------------------
# 站点验证
# --------------------------------------

site_verification:            # 搜索引擎站点验证
  - name: google-site-verification
    content: V5UYqQvPSxtArdCpDgconpASBqf5IJeGsjFPxE2mxNo
  - name: baidu-site-verification
    content: codeva-tNXarU7mp6
  - name: baidu-site-verification
    content: codeva-HYXiIJzU29
  - name: msvalidate.01
    content: 5BA2CBE9D7FFB17A77899CFF1924E8E6

# --------------------------------------
# 美化 / 特效
# --------------------------------------

# 自定义主题颜色（颜色值必须用双引号）
# theme_color:
#   enable: true
#   main: "#49B1F5"
#   paginator: "#00c4b6"
#   button_hover: "#FF7242"
#   text_selection: "#00c4b6"
#   link_color: "#99a9bf"
#   meta_color: "#858585"
#   hr_color: "#A4D8FA"
#   code_foreground: "#F47466"
#   code_background: "rgba(27, 31, 35, .05)"
#   toc_color: "#00c4b6"
#   blockquote_padding_color: "#49b1f5"
#   blockquote_background_color: "#49b1f5"
#   scrollbar_color: "#49b1f5"
#   meta_theme_color_light: "ffffff"
#   meta_theme_color_dark: "#0d0d0d"

# 分类页和标签页的界面样式
category_ui:                  # 分类页样式（index 同首页 / default 同归档页）
tag_ui:                       # 标签页样式（index 同首页 / default 同归档页）

rounded_corners_ui: true      # 界面元素是否使用圆角

text_align_justify: false     # 文章是否两端对齐

mask:
  header: false               # 头部是否加遮罩
  footer: false               # 页脚是否加遮罩

# 加载动画
preloader:
  enable: false               # 是否启用加载动画
  source: 1                   # 动画类型（1 全屏加载 / 2 pace 进度条）
  pace_css_url:               # pace 主题样式地址

enter_transitions: true       # 页面切换过渡动画

display_mode: dark            # 默认显示模式（light / dark）

# 文章内容美化
beautify:
  enable: false               # 是否启用文章美化
  field: post                 # 作用范围（site / post）
  title_prefix_icon:          # 标题前缀图标
  title_prefix_icon_color:    # 标题前缀图标颜色

# 全局字体设置（不要修改，除非知道用途）
font:
  global_font_size: 16px      # 全局字体大小
  code_font_size:             # 代码字体大小
  font_family:                # 字体族
  code_font_family:           # 代码字体族

# 站点标题和副标题字体
blog_title_font:
  font_link:                  # 字体加载链接
  font_family:                # 字体族

# 分隔符图标
hr_icon:
  enable: true                # 是否启用分隔符图标
  icon:                       # Font Awesome 图标 unicode
  icon_top:                   # 图标顶部距离

# 打字机特效（输入时抖动）
activate_power_mode:
  enable: false               # 是否启用
  colorful: true              # 是否彩色
  shake: true                 # 是否抖动
  mobile: false               # 移动端是否启用

# 背景特效
# --------------------------------------

canvas_ribbon:                # 彩带背景
  enable: false               # 是否启用
  size: 150                   # 彩带大小
  alpha: 0.6                  # 透明度（0~1）
  zIndex: -1                  # 层级
  click_to_change: false      # 点击是否换色
  mobile: false               # 移动端是否启用

canvas_fluttering_ribbon:     # 飘动彩带背景
  enable: false               # 是否启用
  mobile: false               # 移动端是否启用

canvas_nest:                  # 粒子连线背景
  enable: false               # 是否启用
  color: '0,0,255'            # 线条颜色 RGB
  opacity: 0.7                # 线条透明度（0~1）
  zIndex: -1                  # 层级
  count: 99                   # 粒子数量
  mobile: false               # 移动端是否启用

fireworks:                    # 鼠标点击烟花特效
  enable: false               # 是否启用
  zIndex: 9999                # 层级
  mobile: false               # 移动端是否启用

click_heart:                  # 鼠标点击爱心特效
  enable: false               # 是否启用
  mobile: false               # 移动端是否启用

clickShowText:                # 鼠标点击文字特效
  enable: false               # 是否启用
  text:                       # 显示的文字
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px              # 文字大小
  random: false               # 是否随机显示
  mobile: false               # 移动端是否启用

# --------------------------------------
# 灯箱设置
# --------------------------------------

lightbox:                     # 图片灯箱（fancybox / medium_zoom，空为不启用）

# --------------------------------------
# 标签插件设置
# --------------------------------------

series:                       # 文章系列
  enable: false               # 是否启用
  orderBy: 'title'            # 排序依据（title / date）
  order: 1                    # 排序方向（1 升序 / -1 降序）
  number: true                # 是否显示序号

abcjs:                        # ABC 乐谱插件
  enable: false               # 是否启用
  per_page: true              # 是否每页加载

mermaid:                      # Mermaid 图表
  enable: false               # 是否启用
  code_write: false           # 是否用代码块写图
  theme:                      # 主题
    light: default            # 亮色主题
    dark: dark                # 暗色主题
  open_in_new_tab: true       # 是否显示新标签页打开按钮
  zoom_pan: true              # 是否支持缩放平移

chartjs:                      # Chart.js 图表
  enable: false               # 是否启用
  fontColor:                  # 图表字体颜色
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  borderColor:                # 图表边框颜色
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  scale_ticks_backdropColor:  # 雷达/极区图刻度背景色
    light: 'transparent'
    dark: 'transparent'

note:                         # 注释块（Bootstrap Callout）
  style: flat                 # 样式（simple / modern / flat / disabled）
  icons: true                 # 是否显示图标
  border_radius: 3            # 圆角大小
  light_bg_offset: 0          # 浅色背景偏移量

# --------------------------------------
# 其他设置
# --------------------------------------

pjax:
  enable: true                # 是否启用 PJAX 无刷新跳转
  exclude:                    # 排除 PJAX 的页面
    # - /xxxxxx/

snackbar:                     # 吐司通知
  enable: false               # 是否启用
  position: bottom-left       # 位置（top-left / top-right / bottom-left / bottom-right 等）
  bg_light: '#49b1f5'         # 亮色模式背景色
  bg_dark: '#1f1f1f'          # 暗色模式背景色

instantpage: false            # 是否启用 Instant.page 预加载

lazyload:
  enable: false               # 是否启用图片懒加载
  native: false               # 是否用浏览器原生懒加载
  field: site                 # 作用范围（site / post）
  placeholder:                # 占位图片
  blur: false                 # 加载前是否模糊

# PWA
pwa:
  enable: false               # 是否启用 PWA
  manifest:                   # manifest 文件
  apple_touch_icon:           # 苹果触摸图标
  favicon_32_32:              # 32x32 图标
  favicon_16_16:              # 16x16 图标
  mask_icon:                  # 遮罩图标

# Open Graph 元标签
Open_Graph_meta:
  enable: true                # 是否启用
  option:                     # 配置
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
structured_data:
  enable: false               # 是否启用
  alternate_name:             # 站点别名（格式: ['name1', 'name2']）

css_prefix: true              # 是否添加浏览器前缀

# 注入代码
# head 插入到 </head> 前，bottom 插入到 </body> 前
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css?v=20260813d">   # 自定义样式
    - <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2932938307892796" crossorigin="anonymous"></script>   # Google AdSense 脚本
  bottom:
    - <script>(function(){var el=document.getElementById('site-runtime');if(!el)return;var start=new Date('2026-03-16T00:00:00.000Z').getTime();function pad(n){return n<10?'0'+n:String(n)}function tick(){var diff=Math.floor((Date.now()-start)/1000);var s=diff%60;diff=Math.floor(diff/60);var m=diff%60;diff=Math.floor(diff/60);var h=diff%24;var d=Math.floor(diff/24);document.getElementById('rt-d').textContent=d;document.getElementById('rt-h').textContent=pad(h);document.getElementById('rt-m').textContent=pad(m);document.getElementById('rt-s').textContent=pad(s)}tick();setInterval(tick,1000)})();</script>   # 建站运行时长
    - <script>(function(){if(window.__clickEffectLoaded)return;window.__clickEffectLoaded=true;document.addEventListener("mousedown",function(e){if(e.button!==0)return;var effect=document.createElement("div");effect.className="click-effect";document.body.appendChild(effect);var w=effect.offsetWidth,h=effect.offsetHeight;effect.style.left=(e.clientX-w*0.50)+"px";effect.style.top=(e.clientY-h*0.54)+"px";setTimeout(function(){effect.remove()},340)})})();</script>   # 鼠标点击特效（点击出现雪碧图动画）
    - <script>(function(){var map={".card-categories .item-headline":"/categories/",".card-tags .item-headline":"/tags/",".card-archives .item-headline":"/archives/"};function addArrows(){Object.keys(map).forEach(function(sel){var h=document.querySelector(sel);if(h&&!h.querySelector(".card-more-btn")){var a=document.createElement("a");a.className="card-more-btn";a.href=map[sel];a.title="查看更多";var i=document.createElement("i");i.className="fas fa-angle-right";a.appendChild(i);h.appendChild(a)}})}addArrows();window.btf&&btf.addGlobalFn("pjaxComplete",addArrows,"cardMoreBtn")})();</script>   # 侧边栏卡片查看更多箭头（PJAX 跳转后重新添加）
    - <script>(function(){function watch(){var n=0;var t=setInterval(function(){n++;var any=Array.from(document.querySelectorAll(".ads-wrap")).some(function(w){var ins=w.querySelector("ins.adsbygoogle");return ins&&ins.getAttribute("data-ad-status")==="filled"});if(any||n>=6){clearInterval(t);if(!any){document.querySelectorAll(".ads-wrap").forEach(function(w){var ins=w.querySelector("ins.adsbygoogle");if(!ins||ins.getAttribute("data-ad-status")!=="filled")w.style.display="none"})}}},1000)}watch();window.btf&&btf.addGlobalFn("pjaxComplete",watch,"watchAds")})();</script>   # 广告加载后未填充（无 data-ad-status=filled）再隐藏广告位
    - <script>(function(){var el=document.createElement("div");el.id="fps";el.style.cssText="position:fixed;right:12px;bottom:12px;z-index:999;font-size:12px;font-weight:normal;color:#aaa;background:none;border:none;padding:0;margin:0;backdrop-filter:none;box-shadow:none;text-shadow:none;pointer-events:none";document.body.appendChild(el);var fps=0;var last=Date.now();function step(){var now=Date.now();fps++;if(now-last>=1000){el.textContent=fps+" FPS";fps=0;last=now}requestAnimationFrame(step)}requestAnimationFrame(step)})();</script>   # 右下角帧率显示（60 FPS 纯文字）
    # - <script src="xxxx"></script>

