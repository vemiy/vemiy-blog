# Hexo 配置文件
## 文档: https://hexo.io/docs/configuration.html
## 源码: https://github.com/hexojs/hexo/

# 站点信息
title: vemiyの小站              # 网站标题
subtitle: ''                    # 网站副标题（空则不显示在首页标签页标题里）
description: vemiyの小站 - 个人技术博客，记录与分享自托管、建站运维及互联网技术实践经验。   # 网站描述
keywords: NAS,飞牛,博客,教程,vemiy,vimy,nitian   # 网站关键词
author: vemiy                  # 作者名
language: zh-CN                # 站点语言
timezone: Asia/Shanghai        # 时区

# 站点网址与文章链接格式
url: https://www.vemiy.com/    # 站点网址
permalink: posts/:title/       # 文章链接格式
permalink_defaults:            # 链接中变量的默认值
pretty_urls:
  trailing_index: false        # 链接去掉末尾的 index.html
  trailing_html: true          # 链接是否去掉末尾的 .html

# 目录配置
source_dir: source             # 源文件目录（文章、页面、图片）
public_dir: public             # 生成的静态文件目录
tag_dir: tags                  # 标签页目录
archive_dir: archives          # 归档页目录
category_dir: categories       # 分类页目录
code_dir: downloads/code       # 代码文件目录
i18n_dir: :lang                # 国际化目录
skip_render:                   # 跳过渲染的文件

# 文章设置
new_post_name: :title.md       # 新文章的文件名格式
default_layout: post           # 新建文章的默认布局
titlecase: false               # 标题是否首字母大写
external_link:
  enable: true                 # 外部链接是否新标签页打开
  field: site                  # 作用范围（site 全站 / post 仅文章）
  exclude: ''                  # 不处理的链接
filename_case: 0               # 文件名大小写（0 不转换 / 1 小写 / 2 大写）
render_drafts: false           # 是否渲染草稿
post_asset_folder: false       # 是否为文章启用资源文件夹
relative_link: false           # 链接是否使用相对路径
future: true                   # 是否渲染未来日期的文章
syntax_highlighter: highlight.js   # 代码高亮器
highlight:
  line_number: true            # 代码块是否显示行号
  auto_detect: false           # 是否自动检测代码语言
  tab_replace: ''              # tab 替换字符
  wrap: true                   # 代码块是否换行包裹
  hljs: false                  # 是否使用 hljs 库
prismjs:
  preprocess: true             # 是否预处理代码
  line_number: true            # 代码块是否显示行号
  tab_replace: ''              # tab 替换字符

# 首页文章列表
index_generator:
  path: ''                     # 首页路径（空为根路径）
  per_page: 10                 # 每页文章数（0 为禁用分页）
  order_by: -date              # 文章排序方式

default_category: uncategorized   # 未设置分类时的默认分类
category_map:                   # 分类别名映射
tag_map:                        # 标签别名映射

meta_generator: true           # 是否输出 meta generator 标签

# 日期格式
date_format: YYYY-MM-DD        # 日期格式
time_format: HH:mm:ss          # 时间格式
updated_option: 'mtime'        # 更新时间来源（mtime 文件时间 / date 文章日期 / empty 空）

# 分页设置
per_page: 10                   # 每页文章数（0 为禁用分页）
pagination_dir: page           # 分页目录名

# 文件过滤
include:                       # 额外包含的文件
exclude:                       # 排除的文件
ignore:                        # 忽略的文件

theme: butterfly               # 使用的主题

deploy:
- type: cjh_bing_url_submitter    # 推送 Bing
- type: cjh_baidu_url_submitter   # 推送百度
- type: cjh_google_url_submitter  # 推送 Google

# 搜索引擎推送
hexo_submit_urls_to_search_engine:
  submit_condition: count       # 提交条件（count 提交最新 N 条）
  count: 10                     # 提交最新文章数
  period: 900                   # 提交修改时间在 N 秒内的链接（未使用）
  google: 0                     # 是否推送 Google（0 否；需密钥文件+代理）
  bing: 1                       # 是否推送 Bing
  baidu: 0                      # 是否推送百度（0 否；未备案，百度不收录）
  txt_path: submit_urls.txt     # 待推送链接清单文件
  baidu_host: https://www.vemiy.com   # 百度站长平台注册域名
  baidu_token: 0                # 百度推送密钥（0 表示从环境变量 BAIDU_TOKEN 读取）
  bing_host: https://www.vemiy.com    # Bing 站长平台注册域名
  bing_token: 0                 # Bing 推送密钥（0 表示从环境变量 BING_TOKEN 读取）
  google_host: https://www.vemiy.com  # Google Search Console 域名
  google_key_file: ''           # Google 服务账号密钥文件（启用 google 时填写）
  google_proxy: 0               # 推送 Google 所用代理（0 不使用）
  replace: 0                    # 是否替换链接中的部分字符串
  find_what: ''
  replace_with: ''

# RSS 订阅
feed:
  type: atom                   # 订阅格式
  path: atom.xml               # 订阅文件路径
  limit: 20                    # 最大文章条数

# 本地搜索
search:
  path: search.xml             # 搜索数据文件路径
  field: post                  # 搜索范围（post 文章 / page 页面 / all 全部）
  content: true                # 是否索引文章内容

# 外链 nofollow（hexo-filter-nofollow，排除本站域名）
nofollow:
  enable: true                  # 是否启用
  field: site                   # 作用范围（site 全站 / post 仅文章）
  exclude:                      # 不处理的域名（写完整子域）
    - 'vemiy.com'
    - 'www.vemiy.com'
